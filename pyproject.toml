[project]
name = "agent-polaris"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.4.12",
    "fastapi>=0.121.0",
    "langchain-openai>=1.0.0",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
